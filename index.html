<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Combiné</title>
  <!-- Polices d'écriture (Manrope pour le texte, DM Mono pour les chiffres) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap">
  <!-- La décoration de la page -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <!-- Écran 1 : Accueil -->
  <section class="screen" id="s1">
    <div class="label head">Mon numéro <span class="net" id="net">Connexion…</span>
      <!-- Mission 9 : ouvrir le répertoire -->
      <button class="chip" id="contactsBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        Contacts
      </button>
    </div>
    <div class="mine">
      <span class="num" id="myCode">482 917</span>
      <button class="copy" id="copyBtn" aria-label="Copier mon numéro">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        <span>Copier</span>
      </button>
    </div>
    <!-- Mission 5 : message si le navigateur ne peut pas garder le numéro -->
    <p class="mic-msg" id="codeMsg" role="status" hidden></p>
    <!-- Test du micro (mission 4) : un bouton + une barre qui bouge avec la voix -->
    <div class="mic">
      <button class="mic-btn" id="micBtn" aria-pressed="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
        <span>Tester le micro</span>
      </button>
      <div class="meter" id="meter" hidden><div class="meter-fill" id="meterFill"></div></div>
    </div>
    <p class="mic-msg" id="micMsg" role="status" hidden></p>
    <!-- Mission 6 : messages du standardiste et des appels (refusé, pas connecté…) -->
    <p class="mic-msg" id="callMsg" role="status" hidden></p>
    <!-- Les chiffres tapés. La case invisible par-dessus sert seulement à « Coller » un code (appui long sur téléphone). -->
    <div class="display-wrap">
      <div class="display num" id="display" aria-live="polite"></div>
      <input class="paste" id="pasteBox" inputmode="none" autocomplete="off" aria-label="Code à appeler (tu peux coller un code ici)">
    </div>
    <div class="pad" id="pad"></div>
    <button class="wide go" id="callBtn" disabled>
      <svg viewBox="0 0 24 24" fill="currentColor"><use href="#ph"/></svg>
      Appeler
    </button>
  </section>

  <!-- Écran 2 : Ça sonne -->
  <section class="screen" id="s2" hidden>
    <div class="center">
      <div class="rings"><div class="avatar" id="outAvatar"></div></div>
      <div class="status" id="outStatus">Ça sonne…</div>
      <div class="cap" id="outHint"></div>
      <div class="big-num num" id="outCode">731 205</div>
    </div>
    <div class="bottom">
      <button class="big stop" id="cancelBtn" aria-label="Raccrocher"><svg viewBox="0 0 24 24" fill="#fff"><use href="#ph"/></svg></button>
      <span class="cap">Raccrocher</span>
    </div>
  </section>

  <!-- Écran 3 : Appel entrant -->
  <section class="screen" id="s3" hidden>
    <div class="center">
      <div class="label">Appel entrant</div>
      <div class="rings"><div class="avatar" id="inAvatar"></div></div>
      <div class="big-num num" id="inCode">731 205</div>
      <div class="cap">vous appelle</div>
    </div>
    <div class="pair">
      <div>
        <button class="big stop" id="refuseBtn" aria-label="Refuser"><svg viewBox="0 0 24 24" fill="#fff"><use href="#ph"/></svg></button>
        <span class="cap">Refuser</span>
      </div>
      <div>
        <button class="big go" id="answerBtn" aria-label="Décrocher"><svg viewBox="0 0 24 24" fill="#fff"><use href="#ph"/></svg></button>
        <span class="cap">Décrocher</span>
      </div>
    </div>
  </section>

  <!-- Écran 4 : Appel en cours -->
  <section class="screen" id="s4" hidden>
    <div class="center">
      <div class="avatar" id="liveAvatar"></div>
      <div class="big-num num small" id="liveCode">731 205</div>
      <div class="label">En appel</div>
      <div class="timer num" id="timer">00:00</div>
      <!-- Mission 7 : où en est le son (connexion, connecté) -->
      <div class="cap" id="soundState">Connexion du son…</div>
      <!-- Si le téléphone bloque le son, un appui sur ce bouton l'allume -->
      <button class="mic-btn" id="soundBtn" hidden>Toucher pour entendre</button>
      <!-- Mission 8 : prévient quand l'ami a coupé son micro -->
      <p class="mic-msg info" id="peerMute" role="status" hidden></p>
    </div>
    <!-- Le haut-parleur caché qui joue la voix de l'ami -->
    <audio id="voice" autoplay playsinline></audio>
    <div class="pair">
      <!-- Mission 8 : couper / rallumer mon micro -->
      <div>
        <button class="big mute" id="muteBtn" aria-pressed="false" aria-label="Couper le micro">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/><path class="slash" d="M3 3l18 18"/></svg>
        </button>
        <span class="cap" id="muteCap">Couper le micro</span>
      </div>
      <div>
        <button class="big stop" id="hangBtn" aria-label="Raccrocher"><svg viewBox="0 0 24 24" fill="#fff"><use href="#ph"/></svg></button>
        <span class="cap">Raccrocher</span>
      </div>
    </div>
  </section>

  <!-- Écran 5 : Répertoire (mission 9) -->
  <section class="screen" id="s5" hidden>
    <div class="bar">
      <button class="mic-btn" id="backBtn">← Retour</button>
      <div class="label">Contacts</div>
      <button class="mic-btn" id="addBtn">+ Ajouter</button>
    </div>
    <p class="mic-msg info" id="bookMsg" role="status" hidden></p>
    <ul class="book" id="book"></ul>
  </section>

  <!-- Écran 6 : Fiche d'un contact, pour l'ajouter ou le modifier (mission 9) -->
  <section class="screen" id="s6" hidden>
    <div class="bar">
      <button class="mic-btn" id="formBack">← Retour</button>
      <div class="label" id="formTitle">Nouveau contact</div>
      <span class="bar-gap"></span>
    </div>
    <form class="form" id="contactForm" novalidate>
      <label class="field">Nom
        <input id="fName" maxlength="30" autocomplete="off" placeholder="ex. Noa">
      </label>
      <label class="field">Code (6 chiffres)
        <input id="fCode" class="num" inputmode="numeric" maxlength="9" autocomplete="off" placeholder="ex. 482 917">
      </label>
      <label class="field"><span>Mail <span class="opt">(facultatif)</span></span>
        <input id="fMail" type="email" inputmode="email" autocomplete="off" placeholder="ex. noa@mail.fr">
      </label>
      <p class="mic-msg" id="formMsg" role="status" hidden></p>
      <button class="wide go save" type="submit">Enregistrer</button>
      <button class="wide plain" type="button" id="delBtn" hidden>Supprimer ce contact</button>
      <!-- La question « Supprimer Noa ? » avant d'effacer pour de bon -->
      <div class="confirm" id="confirmBox" hidden>
        <p id="confirmText">Supprimer ce contact ?</p>
        <div class="confirm-row">
          <button class="mic-btn" type="button" id="noDel">Non</button>
          <button class="mic-btn danger" type="button" id="yesDel">Oui, supprimer</button>
        </div>
      </div>
    </form>
  </section>
</div>

<!-- Le dessin du combiné, réutilisé sur tous les boutons -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ph" viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></symbol>
</svg>

<!-- PeerJS : le « standardiste » qui met les deux pages en relation -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<!-- L'électricité de la page -->
<script src="app.js"></script>
</body>
</html>
